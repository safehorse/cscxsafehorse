server {
    listen 80;
    listen [::]:80;
    server_name cscx.safehorse.com.br;

    root /opt/cscxsafehorse/current;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cscx.safehorse.com.br;

    ssl_certificate /etc/letsencrypt/live/cscx.safehorse.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cscx.safehorse.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /opt/cscxsafehorse/current;
    index index.html;

    access_log /var/log/nginx/cscxsafehorse-access.log;
    error_log /var/log/nginx/cscxsafehorse-error.log;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
